<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders - EchoBite AI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #fff6ee; }
        header { background: linear-gradient(90deg, #ff6b00, #ff8a1f); color: white; text-align: center; padding: 25px; font-size: 30px; font-weight: 800; letter-spacing: 1px; }
        .container { width: 75%; margin: 40px auto; }
        .card { background: white; border-left: 8px solid #ff6b00; padding: 25px; margin-bottom: 25px; border-radius: 12px; box-shadow: 0 5px 18px rgba(0,0,0,0.12); }
        .card h3 { margin: 0 0 12px 0; font-size: 24px; color: #222; }
        .card p { margin: 8px 0; font-size: 18px; color: #444; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; margin-right: 10px; font-weight: 700; color: white; transition: 0.2s; }
        .view { background: #ff6b00; }
        .reorder { background: #ff9f43; }
        .cancel { background: #e74c3c; }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }
        
        #detailsBox { display: none; background: white; padding: 25px; margin-top: 25px; border-radius: 12px; border: 2px solid #ff6b00; }
    </style>
</head>
<body>

<header>🍔 MY ORDERS</header>

<div class="container">
    <div id="orderList">Loading your orders...</div>
    <div id="detailsBox"></div>
</div>

<script>
async function loadAllOrders() {
    try {
        const response = await fetch('https://echobite-ai-backend.onrender.com/api/orders/all');
        const data = await response.json();
        
        document.getElementById("orderList").innerHTML = data.orders.map(order => `
            <div class="card">
                <h3>Order #${order._id.slice(-4)}</h3>
                <p><b>Customer:</b> ${order.userName}</p>
                <p><b>Item:</b> ${order.items[0].foodName}</p>
                <p><b>Status:</b> ${order.status}</p>
                <p><b>Total:</b> ${order.totalPrice} PKR</p>
                
                <button class="btn view" onclick="showDetails('${order._id}')">View</button>
                <button class="btn reorder" onclick="reorder('${order._id}')">Reorder</button>
                <button class="btn cancel" onclick="cancelOrder('${order._id}')">Cancel</button>
            </div>
        `).join('');
    } catch (error) {
        document.getElementById("orderList").innerHTML = "<p>Error loading orders. Check console.</p>";
        console.error(error);
    }
}

function showDetails(id) {
    document.getElementById("detailsBox").style.display = "block";
    document.getElementById("detailsBox").innerHTML = `<h3>Order Details</h3><p>Viewing order: ${id}</p>`;
}

function reorder(id) { alert("Reorder triggered for: " + id.slice(-4)); }
function cancelOrder(id) { if(confirm("Are you sure?")) { alert("Order Cancelled"); } }

loadAllOrders();
</script>

</body>
</html>
