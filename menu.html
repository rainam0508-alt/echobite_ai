<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EchoBite AI Menu</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#fff7ed;
  color:#222;
  padding:30px;
}

h1{
  text-align:center;
  color:#ff6b00;
  font-size:55px;
  margin-bottom:15px;
}

.subtitle{
  text-align:center;
  color:#555;
  margin-bottom:50px;
  font-size:18px;
}

/* NAVBAR (ADDED) */
.navbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.navbar button{
  padding:10px 15px;
  border:2px solid #ff6b00;
  background:white;
  color:#ff6b00;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.navbar button:hover{
  background:#ff6b00;
  color:white;
}

.section-title{
  font-size:35px;
  color:#ff6b00;
  margin:50px 0 25px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  transition:0.4s;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
  border:2px solid #ffe0c2;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 10px 25px rgba(255,107,0,0.3);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.content{
  padding:20px;
}

.content h2{
  color:#ff6b00;
  margin-bottom:10px;
}

.category{
  color:#777;
  margin-bottom:8px;
}

.desc{
  color:#444;
  font-size:14px;
  margin-bottom:10px;
}

/* ⭐ STAR FIX (ADDED) */
.rating span{
  font-size:22px;
  cursor:pointer;
  color:#ccc;
}

.rating span.active{
  color:gold;
}

.size{
  margin-bottom:15px;
}

.size select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:#fff3e6;
  color:#222;
  border:2px solid #ffb26b;
  font-size:15px;
}

.price{
  font-size:24px;
  color:#16a34a;
  font-weight:bold;
  margin-bottom:15px;
}

.cart-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
  background:#ff6b00;
  color:white;
  font-size:16px;
}

.cart-btn:hover{
  background:#ff8c33;
}

</style>
</head>

<body>

<h1>EchoBite AI</h1>

<p class="subtitle">
Smart AI Food Ordering Experience
</p>

<!-- NAVBAR (ADDED ONLY) -->
<div class="navbar">
  <button onclick="scrollToSection('🍕 Pizza Section')">Pizza</button>
  <button onclick="scrollToSection('🍔 Burger Section')">Burger</button>
  <button onclick="scrollToSection('🍟 Fast Food Section')">Fast Food</button>
  <button onclick="scrollToSection('🍹 Drinks Section')">Drinks</button>
  <button onclick="scrollToSection('🍰 Dessert Section')">Dessert</button>
</div>
<a href="index.html" style="
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#ff6b35;
  color:white;
  font-weight:700;
  text-decoration:none;
  padding:10px 20px;
  border-radius:50px;
  margin:15px 0 0 20px;
  font-size:0.95rem;
  box-shadow:0 4px 15px rgba(255,107,53,0.4);
">&#8592; Back to Home</a>
<div id="menu"></div>

<script>

async function loadMenuFromAPI() {
    try {
        const response = await fetch('https://echobite-ai-backend.onrender.com/api/foods');
        const data = await response.json();
        const allFoods = data.foods; 

        const menuContainer = document.getElementById('menu');
        
        // --- YE LINE ZAROORI HAI ---
        menuContainer.innerHTML = ""; 
        // ---------------------------

        allFoods.forEach(item => {
            menuContainer.innerHTML += `
                <div class="card">
                    
<img src="https://echobite-ai-backend.onrender.com/images/${item.image}" 
     style="width: 100px; height: 100px;" 
     onerror="this.src='https://via.placeholder.com/100'">
                    <h3>${item.name}</h3>
                    <p>${item.category}</p>
                    <div class="price-section">
                        <span>Rs ${item.sizes[0].price}</span>
                    </div>
                    <button class="cart-btn" onclick="addToCart('${item.name}', ${item.sizes[0].price})">
                        Add To Cart
                    </button>
                </div>
            `;
        });
    } catch (error) {
        console.error("Error loading menu:", error);
    }
}
// Page load hote hi chalayein
loadMenuFromAPI();



</script>

</body>
</html>
