<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - EchoBite AI Pakistan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .cart-page { max-width: 900px; margin: 120px auto 50px; padding: 0 20px; }
        .cart-header { background: linear-gradient(135deg, #ff7a00, #ff9500); padding: 30px; border-radius: 20px; text-align: center; margin-bottom: 30px; }
        .cart-items-list { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        body.dark .cart-items-list { background: rgba(255,255,255,0.08); }
        .cart-summary { background: white; border-radius: 20px; padding: 20px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        body.dark .cart-summary { background: rgba(255,255,255,0.08); }
        .checkout-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #22c55e, #16a34a); border: none; border-radius: 15px; color: white; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .cart-item-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        body.dark .cart-item-card { border-bottom-color: #334155; }
        .cart-item-card img { width: 70px; height: 70px; border-radius: 15px; object-fit: cover; }
        .quantity-btn { background: #ff7a00; border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; margin: 0 5px; font-weight: bold; }
        .remove-item { background: #ef4444; border: none; color: white; padding: 6px 14px; border-radius: 10px; cursor: pointer; }
        .empty-cart { text-align: center; padding: 50px; }
        .empty-cart .btn { display: inline-block; margin-top: 20px; text-decoration: none; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">🍔 EchoBite AI</div>
    <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html" class="active">Cart</a>
        <a href="profile.html">Profile</a>
    </div>
    <div class="nav-right">
        <div class="cart-btn" id="cartBtn">
            <i class="fa-solid fa-cart-shopping"></i>
            <div class="cart-count" id="cartCount">0</div>
        </div>
        <div class="toggle" id="darkMode"></div>
        <div class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div id="authStatus3" class="auth-status">
            <a href="login.html">Login</a>
        </div>
    </div>
</nav>

<div class="cart-page">
    <div class="cart-header">
        <h1>Your Cart 🛒</h1>
        <p>Review your order before checkout</p>
    </div>
    <div class="cart-items-list" id="cartItemsList"></div>
    <div class="cart-summary">
        <h3>Order Summary</h3>
        <div style="display: flex; justify-content: space-between; margin: 15px 0;">
            <span>Subtotal:</span>
            <span>Rs. <span id="subtotal">0</span></span>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 15px 0;">
            <span>Delivery Fee:</span>
            <span>Rs. 50</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 15px 0; font-size: 20px; font-weight: bold; border-top: 1px solid #e2e8f0; padding-top: 15px;">
            <span>Total:</span>
            <span>Rs. <span id="totalAmount">0</span></span>
        </div>
        <button class="checkout-btn" id="placeOrderBtn">Place Order ✅</button>
    </div>
</div>

<footer>
    <h2>🍔 EchoBite AI</h2>
    <p>AI Powered Voice Food Ordering System | Pakistan</p>
    <p>© 2026 EchoBite AI</p>
</footer>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
