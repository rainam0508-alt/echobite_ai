<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EchoBite</title>

    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="auth-box">
    <div class="cartoon-illustration">
        <i class="fas fa-face-smile"></i>
    </div>

    <h2>Login</h2>

    <!-- Form ID "loginForm" aur inputs ke IDs add kiye hain -->
    <form id="loginForm">
        <input type="email" id="email" placeholder="Enter Email" required>
        <input type="password" id="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>

    <div class="auth-links">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="index.html" class="back-home-btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault(); // Page refresh hone se rokein

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        // Aapke code ke mutabiq sahi endpoint: /api/auth/login
        const response = await fetch('https://echobite-ai-backend.onrender.com/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            const userData = {
                email: email,
                name: data.user?.name || data.name || email.split('@')[0]
            };
            localStorage.setItem('echoUser', JSON.stringify(userData));
            localStorage.setItem('token', data.token);
            alert("Login Successful! ✅");
            window.location.href = "menu.html";
        } else {
            alert("Login Failed: " + (data.message || "Invalid credentials"));
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Server unreachable. Please check your internet or backend.");
    }
});
</script>

</body>
</html>
