<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - EchoBite AI Pakistan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="logo">🍔 EchoBite AI</div>
    <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="menu.html" class="active">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="profile.html">Profile</a>
    </div>
    <div class="nav-right">
        <div class="cart-btn" id="cartBtn">
            <i class="fa-solid fa-cart-shopping"></i>
            <div class="cart-count" id="cartCount">0</div>
        </div>
        <div class="toggle" id="darkMode"></div>
        <div class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div id="authStatus2" class="auth-status">
            <a href="login.html">Login</a>
        </div>
    </div>
</nav>

<div class="cart-sidebar" id="cartSidebar">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>Your Cart 🛒</h2>
        <button id="closeCart"><i class="fa-solid fa-arrow-left"></i> Back</button>
    </div>
    <div id="cartItemsSidebar"></div>
    <h3>Total: Rs. <span id="totalSidebar">0</span></h3>
    <button class="checkout" onclick="location.href='cart.html'">Checkout ✅</button>
</div>

<section style="padding-top: 120px;">
    <h2 class="section-title">Our <span>Menu</span></h2>

    <div class="search-box">
        <input type="text" placeholder="🔍 Search food..." id="searchInput">
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Burger">Burgers 🍔</button>
        <button class="filter-btn" data-filter="Pizza">Pizza 🍕</button>
        <button class="filter-btn" data-filter="Pasta">Pasta 🍝</button>
        <button class="filter-btn" data-filter="Drink">Drinks 🥤</button>
        <button class="filter-btn" data-filter="Dessert">Desserts 🍰</button>
    </div>

    <div class="food-grid" id="foodGrid"></div>
</section>

<footer>
    <h2>🍔 EchoBite AI</h2>
    <p>AI Powered Voice Food Ordering System | Pakistan</p>
    <p>© 2026 EchoBite AI</p>
</footer>

<div class="toast" id="toast">Item Added To Cart</div>

<script src="script.js"></script>
</body>
</html
