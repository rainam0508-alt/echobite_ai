<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EchoBite Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #12141c;
            color: #f3f4f6;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background-color: #1a1d29;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2a2f45;
        }

        .sidebar h2 {
            color: #ff4757;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            color: #a0aec0;
            text-decoration: none;
            padding: 12px 20px;
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .sidebar a i {
            margin-right: 12px;
            font-size: 18px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .main-content h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #fff;
            border-bottom: 2px solid #2a2f45;
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background-color: #1a1d29;
            border: 1px solid #2a2f45;
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 71, 87, 0.15);
        }

        .stat-card__icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 20px;
        }

        .stat-card__icon.users { background: rgba(74, 144, 226, 0.15); color: #4a90e2; }
        .stat-card__icon.orders { background: rgba(255, 107, 129, 0.15); color: #ff6b81; }
        .stat-card__icon.foods { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .stat-card__icon.revenue { background: rgba(76, 175, 80, 0.15); color: #81c784; }

        .stat-card h3 {
            color: #a0aec0;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card p {
            color: #ff6b81;
            font-size: 32px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>EchoBite Admin</h2>
        <a href="dashboard.html" class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="users.html"><i class="fa-solid fa-users"></i> Users</a>
        <a href="foods.html"><i class="fa-solid fa-utensils"></i> Foods</a>
        <a href="orders.html"><i class="fa-solid fa-basket-shopping"></i> Orders</a>
        <a href="reports.html"><i class="fa-solid fa-chart-line"></i> Reports</a>
    </div>

    <div class="main-content">
        <h1>Dashboard Overview</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card__icon users">
                    <i class="fa-solid fa-users"></i>
                </div>
                <h3>Users</h3>
                <p id="users-count">...</p>
            </div>

            <div class="stat-card">
                <div class="stat-card__icon orders">
                    <i class="fa-solid fa-basket-shopping"></i>
                </div>
                <h3>Orders</h3>
                <p id="orders-count">...</p>
            </div>

            <div class="stat-card">
                <div class="stat-card__icon foods">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h3>Foods</h3>
                <p id="foods-count">...</p>
            </div>

            <div class="stat-card">
                <div class="stat-card__icon revenue">
                    <i class="fa-solid fa-sack-dollar"></i>
                </div>
                <h3>Total Revenue</h3>
                <p id="reports-count">...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const dashboardRes = await fetch('https://echobite-ai-backend.onrender.com/api/admin/dashboard');
                const data = await dashboardRes.json();

                document.getElementById('users-count').innerText = data.totalUsers ?? 0;
                document.getElementById('orders-count').innerText = data.totalOrders ?? 0;
                document.getElementById('foods-count').innerText = data.totalFoods ?? 0;
                document.getElementById('reports-count').innerText = `PKR ${data.totalRevenue ?? 0}`;
            } catch (err) {
                console.error('API Error:', err);
                document.getElementById('users-count').innerText = '—';
                document.getElementById('orders-count').innerText = '—';
                document.getElementById('foods-count').innerText = '—';
                document.getElementById('reports-count').innerText = '—';
            }
        }

        loadDashboard();
    </script>
</body>
</html>
