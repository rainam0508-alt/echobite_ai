<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoBite AI Menu</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="auth-nav.css">

  <style>
    :root {
      --color-primary: #ff6b35;
      --color-primary-dark: #e55a2b;
      --color-primary-light: #ff8c33;
      --color-bg: #fffaf5;
      --color-surface: #ffffff;
      --color-border: #ffe0c2;
      --color-text: #2c241e;
      --color-text-muted: #6b5f56;
      --color-price: #16a34a;
      --color-focus: #ff6b35;
      --shadow-sm: 0 2px 8px rgba(44, 36, 30, 0.06);
      --shadow-md: 0 8px 24px rgba(44, 36, 30, 0.1);
      --shadow-hover: 0 16px 40px rgba(255, 107, 53, 0.22);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 999px;
      --transition: 0.25s ease;
      --max-width: 1280px;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    :focus-visible {
      outline: 3px solid var(--color-focus);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      z-index: 2000;
      padding: 0.75rem 1rem;
      background: var(--color-primary);
      color: #fff;
      border-radius: var(--radius-sm);
      font-weight: 600;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 1rem;
    }

    /* Page shell */
    .page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 6.5rem clamp(1rem, 4vw, 2.5rem) 3rem;
    }

    /* Site navbar (shared across pages) */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 8%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      z-index: 1000;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-right: 20px;
    }

    .logo span {
      color: #ff6b35;
    }

    .nav-links {
      display: flex;
      gap: 35px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      transition: color var(--transition);
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"] {
      color: #ff6b35;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .login-btn {
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
      color: #111;
      text-decoration: none;
      font-family: inherit;
      font-size: 0.95rem;
      transition: background var(--transition), transform var(--transition);
    }

    .login-btn:hover {
      background: #f3f3f3;
      transform: translateY(-1px);
    }

    /* Page intro */
    .page-intro {
      text-align: center;
      margin-bottom: 2rem;
    }

    .page-intro h1 {
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 800;
      color: var(--color-primary);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 0.35rem;
      color: var(--color-text-muted);
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 500;
    }

    /* Category navigation */
    .category-nav {
      margin-bottom: 2rem;
    }

    .category-nav__label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      margin-bottom: 0.75rem;
    }

    .category-filter {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .category-filter button {
      padding: 0.6rem 1.1rem;
      border: 2px solid var(--color-primary);
      background: var(--color-surface);
      color: var(--color-primary);
      border-radius: var(--radius-pill);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background var(--transition), color var(--transition), transform var(--transition), box-shadow var(--transition);
    }

    .category-filter button:hover {
      background: var(--color-primary);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .category-filter button:active {
      transform: translateY(0);
    }

    .category-filter button.active {
      background: var(--color-primary);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    /* Menu grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
      gap: 1.5rem;
    }

    /* Cards */
    .card {
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .card__image-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
      background: #f3ebe3;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.04);
    }

    .content {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 1.25rem;
      gap: 0.5rem;
    }

    .content h2,
    .content h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.3;
    }

    .category {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      width: fit-content;
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-pill);
      background: #fff3e8;
      color: var(--color-primary-dark);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .price-section {
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .price {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--color-price);
      letter-spacing: -0.01em;
    }

    .cart-btn {
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      background: var(--color-primary);
      color: #fff;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .cart-btn:hover {
      background: var(--color-primary-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.35);
    }

    .cart-btn:active {
      transform: translateY(0);
    }

    /* Loading & error states */
    .status-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--color-text-muted);
      font-size: 1rem;
    }

    .status-message--loading i {
      color: var(--color-primary);
      font-size: 2rem;
      margin-bottom: 0.75rem;
      display: block;
    }

    .status-message--error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .nav-links {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .page {
        padding-top: 5.5rem;
      }

      .category-filter {
        justify-content: flex-start;
      }

      .card__image-wrap {
        height: 180px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding-top: 5rem;
      }

      .category-filter button {
        flex: 1 1 calc(50% - 0.6rem);
        text-align: center;
        padding: 0.55rem 0.75rem;
        font-size: 0.85rem;
      }

      .content {
        padding: 1rem;
      }
    }

    /* Footer */
    footer {
      background: #1c1c28;
      padding: 40px 8%;
      text-align: center;
      color: #fff;
      margin-top: 50px;
    }

    footer h2 {
      margin-bottom: 10px;
    }

    footer p {
      color: #ccc;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }

      .card:hover {
        transform: none;
      }

      .card:hover img {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#menu">Skip to menu</a>

  <nav class="navbar" aria-label="Main navigation">
    <a href="index.html" class="logo">
      <i class="fas fa-robot" aria-hidden="true"></i>
      Echo<span>Bite</span>
    </a>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html" aria-current="page">Menu</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#services">Our Services</a></li>
    </ul>

    <div class="nav-buttons" id="nav-auth">
      <a href="login.html" class="login-btn">Login</a>
    </div>
  </nav>

  <div class="page">
    <div class="page-intro">
      <h1>EchoBite AI</h1>
      <p class="subtitle">Smart AI Food Ordering Experience</p>
    </div>

    <nav class="category-nav" aria-label="Food categories">
      <p class="category-nav__label">Filter by category</p>
      <div class="category-filter">
        <button type="button" class="active" data-category="All" onclick="filterByCategory('All', this)">All</button>
        <button type="button" data-category="Pizza" onclick="filterByCategory('Pizza', this)">Pizza</button>
        <button type="button" data-category="Burger" onclick="filterByCategory('Burger', this)">Burger</button>
        <button type="button" data-category="Fast Food" onclick="filterByCategory('Fast Food', this)">Fast Food</button>
        <button type="button" data-category="Drinks" onclick="filterByCategory('Drinks', this)">Drinks</button>
        <button type="button" data-category="Dessert" onclick="filterByCategory('Dessert', this)">Dessert</button>
      </div>
    </nav>

    <main>
      <div id="menu" class="menu-grid" role="list" aria-live="polite" aria-busy="true">
        <p class="status-message status-message--loading" role="status">
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          Loading menu…
        </p>
      </div>
    </main>
  </div>

  <footer>
    <h2>EchoBite AI</h2>
    <p>Smart Food Ordering System</p>
  </footer>

  <script src="auth.js"></script>
  <script src="cart.js"></script>
  <script>
    let allFoods = [];
    let activeCategory = 'All';

    function matchesCategory(itemCategory, filterCategory) {
      const item = (itemCategory || '').toLowerCase().trim();
      const filter = filterCategory.toLowerCase().trim();

      if (filter === 'all') return true;
      if (item === filter) return true;

      if (filter === 'drinks' && (item === 'drink' || item === 'drinks')) return true;
      if (filter === 'fast food' && (item === 'fast food' || item === 'snack' || item === 'pasta')) return true;

      return false;
    }

    function renderMenu(foods) {
      const menuContainer = document.getElementById('menu');
      menuContainer.innerHTML = '';

      if (!foods.length) {
        menuContainer.innerHTML = `
          <p class="status-message" role="status">
            No items found in this category.
          </p>
        `;
        return;
      }

      foods.forEach(item => {
        const price = item.sizes && item.sizes[0] ? item.sizes[0].price : 0;
        const safeName = item.name.replace(/'/g, "\\'");

        menuContainer.innerHTML += `
          <article class="card" role="listitem" data-category="${item.category}">
            <div class="card__image-wrap">
              <img
                src="https://echobite-ai-backend.onrender.com/images/${item.image}"
                alt="${item.name}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/400x200?text=Food+Image'"
              >
            </div>
            <div class="content">
              <h3>${item.name}</h3>
              <p class="category">${item.category}</p>
              <div class="price-section">
                <span class="price">Rs ${price}</span>
              </div>
              <button type="button" class="cart-btn" onclick="addToCart('${safeName}', ${price})">
                <i class="fa-solid fa-cart-plus" aria-hidden="true"></i>
                Add To Cart
              </button>
            </div>
          </article>
        `;
      });
    }

    function filterByCategory(category, buttonEl) {
      activeCategory = category;

      document.querySelectorAll('.category-filter button').forEach(btn => {
        btn.classList.toggle('active', btn === buttonEl);
      });

      const filtered = category === 'All'
        ? allFoods
        : allFoods.filter(item => matchesCategory(item.category, category));

      renderMenu(filtered);
    }

    const BACKEND_URL = EchoCart.BACKEND_URL;

    async function addToCart(name, price) {
      const food = allFoods.find(item => item.name === name);

      if (!food || !food._id) {
        alert('Food item not found.');
        return;
      }

      const result = await EchoCart.addToCart({
        productId: food._id,
        name,
        price: Number(price),
        image: EchoCart.buildImageUrl(food.image),
        selectedSize: 'Regular'
      });

      if (result.success) {
        alert(name + ' cart mein add ho gaya! 🛒\nTotal items: ' + result.totalItems);
      }
    }

    async function loadMenuFromAPI() {
      const menuContainer = document.getElementById('menu');

      try {
        const response = await fetch('https://echobite-ai-backend.onrender.com/api/foods');
        const data = await response.json();
        allFoods = data.foods || [];

        menuContainer.setAttribute('aria-busy', 'false');
        renderMenu(activeCategory === 'All' ? allFoods : allFoods.filter(item => matchesCategory(item.category, activeCategory)));
      } catch (error) {
        console.error("Error loading menu:", error);
        menuContainer.setAttribute('aria-busy', 'false');
        menuContainer.innerHTML = `
          <p class="status-message status-message--error" role="alert">
            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
            Unable to load the menu. Please try again later.
          </p>
        `;
      }
    }

    loadMenuFromAPI();
  </script>
</body>
</html>
