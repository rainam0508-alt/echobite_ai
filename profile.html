<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - EchoBite AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 120px auto 50px;
            padding: 0 20px;
        }
        .profile-header {
            background: linear-gradient(135deg, #ff7a00, #ff9500);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            margin-bottom: 30px;
        }
        .profile-info {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        body.dark .profile-info {
            background: rgba(255,255,255,0.08);
        }
        .orders-history {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        body.dark .orders-history {
            background: rgba(255,255,255,0.08);
        }
        .order-card {
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
        }
        body.dark .order-card {
            border-color: #334155;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
        }
        .guest-message {
            text-align: center;
            padding: 50px;
        }
        .guest-message .btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">🍔 EchoBite AI</div>
    <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="profile.html" class="active">Profile</a>
    </div>
    <div class="nav-right">
        <div class="cart-btn" id="cartBtn">
            <i class="fa-solid fa-cart-shopping"></i>
            <div class="cart-count" id="cartCount">0</div>
        </div>
        <div class="toggle" id="darkMode"></div>
        <div class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div id="authStatus4" class="auth-status"></div>
    </div>
</nav>

<div class="profile-container" id="profileContainer"></div>

<footer>
    <h2>🍔 EchoBite AI</h2>
    <p>AI Powered Voice Food Ordering System | Pakistan</p>
    <p>© 2026 EchoBite AI</p>
</footer>

<script src="script.js"></script>
</body>
</html>
