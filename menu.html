<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EchoBite AI Menu</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  padding:30px;
}

h1{
  text-align:center;
  color:#00f7ff;
  font-size:55px;
  margin-bottom:15px;
}

.subtitle{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:50px;
}

.section-title{
  font-size:35px;
  color:#00f7ff;
  margin:50px 0 25px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card{
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
  transition:0.4s;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.card:hover{
  transform:translateY(-10px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.content{
  padding:20px;
}

.content h2{
  color:#00f7ff;
  margin-bottom:10px;
}

.category{
  color:#94a3b8;
  margin-bottom:8px;
}

.desc{
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:10px;
}

.rating{
  color:gold;
  margin-bottom:15px;
}

.size{
  margin-bottom:15px;
}

.size select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:#0f172a;
  color:white;
}

.price{
  font-size:24px;
  color:#22c55e;
  font-weight:bold;
  margin-bottom:15px;
}

.cart-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
  background:#00f7ff;
  color:black;
}

.cart-btn:hover{
  background:white;
}

</style>
</head>

<body>

<p class="subtitle">
Smart AI Food Ordering Experience
</p>

<div id="menu"></div>

const menu = document.getElementById("menu");

menuData.forEach(section => {

let sectionHTML = `
<h2 class="section-title">${section.title}</h2>

<div class="menu-grid">
`;

section.items.forEach(item => {

sectionHTML += `

<div class="card">

<img src="${item.image}">

<div class="content">

<h2>${item.name}</h2>

<p class="category">
${section.title}
</p>

<p class="desc">
Fresh & delicious ${item.name} made with premium ingredients.
</p>

<div class="rating">
⭐⭐⭐⭐⭐
</div>

<div class="size">

<select onchange="changePrice(this)">

<option value="${item.small}">
Small
</option>

<option value="${item.medium}">
Medium
</option>

<option value="${item.large}">
Large
</option>

</select>

</div>

<div class="price">
Rs ${item.small}
</div>

<button class="cart-btn">
Add To Cart
</button>

</div>

</div>

`;

});

sectionHTML += `</div>`;

menu.innerHTML += sectionHTML;

});

function changePrice(select){

const priceBox = select.parentElement.nextElementSibling;

priceBox.innerHTML = "Rs " + select.value;

}

</script>

</body>
</html>
