<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EchoBite AI Menu</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#fff7ed;
  color:#222;
  padding:30px;
}

h1{
  text-align:center;
  color:#ff6b00;
  font-size:55px;
  margin-bottom:15px;
}

.subtitle{
  text-align:center;
  color:#555;
  margin-bottom:50px;
  font-size:18px;
}

/* NAVBAR (ADDED) */
.navbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.navbar button{
  padding:10px 15px;
  border:2px solid #ff6b00;
  background:white;
  color:#ff6b00;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.navbar button:hover{
  background:#ff6b00;
  color:white;
}

.section-title{
  font-size:35px;
  color:#ff6b00;
  margin:50px 0 25px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  transition:0.4s;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
  border:2px solid #ffe0c2;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 10px 25px rgba(255,107,0,0.3);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.content{
  padding:20px;
}

.content h2{
  color:#ff6b00;
  margin-bottom:10px;
}

.category{
  color:#777;
  margin-bottom:8px;
}

.desc{
  color:#444;
  font-size:14px;
  margin-bottom:10px;
}

/* ⭐ STAR FIX (ADDED) */
.rating span{
  font-size:22px;
  cursor:pointer;
  color:#ccc;
}

.rating span.active{
  color:gold;
}

.size{
  margin-bottom:15px;
}

.size select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:#fff3e6;
  color:#222;
  border:2px solid #ffb26b;
  font-size:15px;
}

.price{
  font-size:24px;
  color:#16a34a;
  font-weight:bold;
  margin-bottom:15px;
}

.cart-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
  background:#ff6b00;
  color:white;
  font-size:16px;
}

.cart-btn:hover{
  background:#ff8c33;
}

</style>
</head>

<body>

<p class="subtitle">
Smart AI Food Ordering Experience
</p>

<!-- NAVBAR (ADDED ONLY) -->
<div class="navbar">
  <button onclick="scrollToSection('🍕 Pizza Section')">Pizza</button>

const menu = document.getElementById("menu");

menuData.forEach(section => {

let sectionHTML = `
<h2 class="section-title">${section.title}</h2>

<div class="menu-grid">
`;

section.items.forEach(item => {

sectionHTML += `
<div class="card">

<img src="${item.image}">

<div class="content">

<h2>${item.name}</h2>

<p class="category">
${section.title}
</p>

<p class="desc">
Fresh & delicious ${item.name} made with premium ingredients.
</p>

<!-- ⭐ STAR (UPDATED CLICKABLE) -->
<div class="rating">
  <span onclick="rate(this,1)">★</span>
  <span onclick="rate(this,2)">★</span>
  <span onclick="rate(this,3)">★</span>
  <span onclick="rate(this,4)">★</span>
  <span onclick="rate(this,5)">★</span>
</div>

<div class="size">

<select onchange="changePrice(this)">

<option value="${item.small}">
Small
</option>

<option value="${item.medium}">
Medium
</option>

<option value="${item.large}">
Large
</option>

</select>

</div>

<div class="price">
Rs ${item.small}
</div>

<button class="cart-btn">
Add To Cart
</button>

</div>

</div>
`;

});

sectionHTML += `</div>`;

menu.innerHTML += sectionHTML;

});

/* PRICE CHANGE */
function changePrice(select){
const priceBox = select.parentElement.nextElementSibling;
priceBox.innerHTML = "Rs " + select.value;
}

/* ⭐ RATING FUNCTION (ADDED) */
function rate(el,value){

let parent = el.parentElement;
let stars = parent.querySelectorAll("span");

stars.forEach((s,i)=>{
  if(i < value){
    s.classList.add("active");
  } else {
    s.classList.remove("active");
  }
});

}

/* NAV SCROLL (ADDED) */
function scrollToSection(title){

let sections = document.querySelectorAll(".section-title");

sections.forEach(sec=>{
  if(sec.innerText === title){
    sec.scrollIntoView({behavior:"smooth"});
  }
});

}

</script>

</body>
</html>
