<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EchoBite AI Menu</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  padding:30px;
}

h1{
  text-align:center;
  color:#00f7ff;
  font-size:55px;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:50px;
}

.section-title{
  font-size:35px;
  color:#00f7ff;
  margin:50px 0 25px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card{
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
  transition:0.4s;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.card:hover{
  transform:translateY(-10px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.content{
  padding:20px;
}

.content h2{
  color:#00f7ff;
  margin-bottom:10px;
}

.category{
  color:#94a3b8;
  margin-bottom:8px;
}

.desc{
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:10px;
}

.rating{
  color:gold;
  margin-bottom:10px;
}

.price{
  font-size:24px;
  color:#22c55e;
  font-weight:bold;
  margin-bottom:15px;
}

.size{
  margin-bottom:15px;
}

.size select{
  padding:8px;
  border-radius:8px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.quantity button{
  width:30px;
  height:30px;
  border:none;
  background:#00f7ff;
  border-radius:5px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.btn-box{
  display:flex;
  gap:10px;
}

.cart-btn,
.order-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.cart-btn{
  background:#00f7ff;
  color:black;
}

.order-btn{
  background:#22c55e;
  color:white;
}

.cart-btn:hover{
  background:white;
}

.order-btn:hover{
  background:#16a34a;
}

.ai-box{
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  margin-bottom:50px;
  text-align:center;
}

.ai-box h2{
  color:#00f7ff;
  margin-bottom:15px;
}

.ai-box p{
  color:#cbd5e1;
  margin-bottom:20px;
}

.ai-btn{
  padding:12px 30px;
  border:none;
  border-radius:10px;
  background:#00f7ff;
  font-weight:bold;
  cursor:pointer;
}

</style>
</head>

<body>

<h1>EchoBite AI</h1>

<p class="subtitle">
Smart AI Food Ordering Experience
</p>

<!-- AI SECTION -->

<div class="ai-box">

<h2>🤖 AI Recommendation Section</h2>

<p>
Get smart food suggestions according to your mood & taste.
</p>

<button class="ai-btn">
Get AI Recommendations
</button>

</div>

<!-- MENU -->

<div id="menu"></div>

<script>

},
{
name:"Cheese Pizza",

},
{
name:"BBQ Pizza",
image:"https://images.unsplash.com/photo-1594007654729-407eedc4be65?w=800"
}
]
},

{
title:"🍔 Burger Section",
items:[
{
name:"Zinger Burger",

},
{
name:"Beef Burger",
image:"https://images.unsplash.com/photo-1550547660-d9450f859349?w=800"
},
{

},
{
name:"Cheese Burger",

}

},

{

{

},
{

},
{
name:"Nuggets",
image:"https://images.unsplash.com/photo-1562967916-eb82221dfb92?w=800"
},
{
name:"Fried Chicken",

}
]
},

{

}
]
},

{
title:"🍰 Dessert Section",
items:[
{
name:"Chocolate Cake",
image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=800"

{

},
{

image:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=800"
}
]
}

];

const menu = document.getElementById("menu");

menuData.forEach(section => {

let sectionHTML = `
<h2 class="section-title">${section.title}</h2>

<div class="menu-grid">
`;

section.items.forEach(item => {

sectionHTML += `

<div class="card">

<img src="${item.image}">

<div class="content">

<h2>${item.name}</h2>

<p class="category">
${section.title}
</p>

<p class="desc">
Fresh & delicious ${item.name} made with premium ingredients.
</p>

<div class="rating">
⭐⭐⭐⭐⭐
</div>

<div class="size">

<select>
<option>Small</option>
<option>Medium</option>
<option>Large</option>
</select>

</div>

<div class="price">
$12
</div>

<div class="quantity">

<button>-</button>

<span>1</span>

<button>+</button>

</div>

<div class="btn-box">

<button class="cart-btn">
Add To Cart
</button>

<button class="order-btn">
Order Now
</button>

</div>

</div>

</div>

`;

});

sectionHTML += `</div>`;

menu.innerHTML += sectionHTML;

});

</script>

</body>
</html>
